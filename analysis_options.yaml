include: package:flutter_lints/recommended.yaml

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - avoid_print
    - use_key_in_widget_constructors
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_const_literals_to_create_immutables

analyzer:
  errors:
    deprecated_member_use: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart" 